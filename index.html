<!DOCTYPE html>
<html>
<head>
  <title>Counter App</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:100px;">

<h1>Counter App</h1>
<h2 id="count">0</h2>

<button onclick="increase()">+</button>
<button onclick="decrease()">-</button>

<script>
let count = 0;

function increase() {
  count++;
  document.getElementById("count").innerText = count;
}

function decrease() {
  count--;
  document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
